    <stop offset="0" stop-color="#FFF4D6" stop-opacity=".95"/><stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="640" fill="url(#sky)"/>
